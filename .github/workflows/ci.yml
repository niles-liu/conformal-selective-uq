name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.10", deps: latest }
          - { python-version: "3.13", deps: latest }
          - { python-version: "3.12", deps: locked }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (latest compatible versions)
        if: matrix.deps == 'latest'
        run: pip install -e ".[dev]"
      - name: Install (the exact versions the published numbers were produced with)
        if: matrix.deps == 'locked'
        run: |
          pip install -r requirements-lock.txt
          pip install -e . --no-deps
          pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
